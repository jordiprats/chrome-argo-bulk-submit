<!doctype html>
<meta charset="utf-8">
<title>Argo Submit settings</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 520px; margin: 32px auto; }
  label { display: block; margin: 14px 0 4px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; }
  button { margin-top: 16px; padding: 6px 16px; }
  small { color: #666; }
</style>
<h2>Argo Submit</h2>
<small>These settings only affect the argo CLI token sync. The bulk-submit button does not need them
(enable it per site from the toolbar popup).</small>
<label for="host">Argo server host</label>
<input id="host" type="text" placeholder="argo.example.com">
<label><input id="writeFile" type="checkbox"> Keep <code>~/.cache/argo-sso/env</code> updated (needs the native host)</label>
<button id="save">Save</button> <span id="msg"></span>
<script type="module" src="options.js"></script>
